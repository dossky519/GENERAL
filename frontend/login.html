<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - Ubuntu 계정 관리</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="login-main">
  <section class="panel login-panel">
    <h2>Ubuntu 계정 관리 콘솔 로그인</h2>
    <form id="login-form">
      <label>아이디
        <input type="text" id="l-username" name="username" required autofocus autocomplete="username">
      </label>
      <label>비밀번호
        <input type="password" id="l-password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="primary">로그인</button>
    </form>
    <div id="login-error" class="hint danger hidden"></div>
  </section>
</main>
<script src="/static/login.js"></script>
</body>
</html>
